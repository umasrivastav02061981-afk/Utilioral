<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base64 Text | Utilioral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=Instrument+Serif:ital@1&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../style.css">
<link rel="stylesheet" href="base64text.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Util<span>ioral</span></div>
    <a class="btn" href="../../../index.html">← Home</a>
  </header>

  <section class="tool-head">
    <span class="chip mono">✍️ Text Tools</span>
    <h1>Base64 <em>Text.</em></h1>
  </section>

  <main class="b6">
    <div class="tabs" id="modes">
      <button class="u on" data-m="enc">Encode</button>
      <button class="u" data-m="dec">Decode</button>
    </div>

    <label><span id="inLabel">Text to encode</span>
      <textarea id="inp" placeholder="Type or paste here..."></textarea>
    </label>

    <label class="opt"><input type="checkbox" id="safe"> URL-safe Base64 (uses - and _ , no = padding)</label>

    <label>Result
      <textarea id="out" readonly placeholder="Result appears here"></textarea>
    </label>

    <div class="stats mono" id="stats"></div>

    <div class="actions">
      <button class="btn main" id="copy">Copy result</button>
      <button class="btn" id="swap">Swap ⇅</button>
      <button class="btn" id="clear">Clear</button>
    </div>

    <p id="msg" class="note mono"></p>
  </main>
</div>
<script src="base64text.js"></script>
</body>
</html>
